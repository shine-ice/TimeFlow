appId: com.timeflow.desktop
productName: TimeFlowDesktopApp

directories:
  output: ../../release
  buildResources: build

asar: true

files:
  - dist/main/**/*
  - dist/preload/**/*
  - package.json

extraResources:
  - from: ../web/dist
    to: web
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

artifactName: ${productName}-${version}-${arch}.${ext}
